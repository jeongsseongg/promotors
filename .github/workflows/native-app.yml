name: Promotors independent native app
on:
  push:
    branches: [codex/native-app-separation-20261015]
    paths: ['native-app/**', '.github/workflows/native-app.yml']
  workflow_dispatch:
    inputs:
      review_only:
        description: 업로드된 프로모터스 빌드의 정식 심사 상태 확인 및 제출
        type: boolean
        default: false
      review_mode:
        description: inspect는 조회, prepare는 초안, submit은 제출, release는 공개, automatic은 승인 후 자동 공개, cancel은 확인한 기존 빌드 심사 취소
        type: choice
        options: [inspect, prepare, submit, release, cancel, automatic]
        default: inspect
      confirm_review_version:
        description: 준비·제출·공개할 정확한 버전/빌드 (예 1.1.2/38)
        type: string
        default: ""
      confirm_replaced_build:
        description: 교체를 위해 심사를 취소할 기존 빌드 번호 (취소 모드에서만 입력)
        type: string
        default: ""
      confirm_exempt_version:
        description: 기존 면제 신고와 동일함을 확인한 정확한 버전/빌드 (평소에는 비움)
        type: string
        default: ""
      testflight_only:
        description: 이미 업로드한 빌드를 기존 내부 테스트 그룹에만 배정
        type: boolean
        default: false
      ongoing_only:
        description: 상시알림 수정 검증 시 iOS 캡처 범위만 좁힘 (컴파일·Android·서버 검사 유지)
        type: boolean
        default: false
      android_only:
        description: 안드로이드 검증만 실행 (iOS 빌드와 업로드 제외)
        type: boolean
        default: false
      ios_only:
        description: 아이폰 전체 검증과 업로드만 실행 (별도 Android 검증 유지)
        type: boolean
        default: false
      archive:
        description: Build with the existing iOS distribution identity
        type: boolean
        default: false
      upload:
        description: Upload verified native build to App Store Connect
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ${{ inputs.review_only && 'promotors-store-review' || inputs.android_only == true && inputs.archive == false && inputs.upload == false && 'promotors-independent-native-android-validation' || 'promotors-independent-native' }}
  cancel-in-progress: ${{ inputs.review_only != true }}
jobs:
  server:
    if: ${{ inputs.testflight_only != true && inputs.review_only != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Reject conflicting platform selections
        if: ${{ inputs.android_only && inputs.ios_only }}
        run: |
          echo "::error::Select only one platform restriction."
          exit 1
      - name: Verify native server privacy, registration and reservation actions
        run: node --test scripts/test-existing-testflight.cjs scripts/test-customer-activity-sql.cjs scripts/test-customer-push.cjs scripts/test-apns-activity-lifecycle.cjs scripts/test-native-activity-feedback.cjs scripts/test-fcm-account-switch.cjs scripts/test-fcm-subscribe.cjs scripts/test-fcm-transport.cjs scripts/test-fcm-worker.cjs scripts/test-native-booking-action.cjs scripts/test-native-push.cjs scripts/test-native-subscribe.cjs native-app/server/tests/test-native-sync.cjs
  android:
    if: ${{ inputs.ios_only != true && inputs.testflight_only != true && inputs.review_only != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: native-app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install native toolchain
        run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0' 'ndk;27.1.12297006'
      - name: Verify native TypeScript and component behavior
        working-directory: native-app
        run: |
          npm ci --ignore-scripts
          npm run typecheck
          npm test -- --runInBand
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile and test actual Android notification components
        working-directory: native-app/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest
          ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest -PnativeQa=true -PreactNativeArchitectures=x86_64
      - name: Enable Android emulator hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo modprobe kvm || true
          sudo modprobe kvm_intel || sudo modprobe kvm_amd || true
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
          if [ -r /dev/kvm ] && [ -w /dev/kvm ]; then
            echo 'Android VM acceleration is available.'
          else
            echo '::notice::KVM is unavailable; the emulator must pass the same capture checks using software emulation.'
          fi
      - name: Run independent native app on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          disable-linux-hw-accel: auto
          emulator-boot-timeout: 900
          script: python3 native-app/scripts/capture-android.py
      - name: Build production entry without QA fixtures
        working-directory: native-app/android
        run: ./gradlew --no-daemon bundleRelease -PreactNativeArchitectures=arm64-v8a,armeabi-v7a,x86_64
      - name: Verify native production bundle and release identity
        working-directory: native-app
        run: |
          curl --fail --location --silent --show-error 'https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar' --output "$RUNNER_TEMP/bundletool.jar"
          printf '%s  %s\n' 'a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29' "$RUNNER_TEMP/bundletool.jar" | sha256sum --check
          mkdir -p qa-results/release
          node scripts/check-android-release.cjs --aab android/app/build/outputs/bundle/release/app-release.aab --java "$JAVA_HOME/bin/java" --bundletool "$RUNNER_TEMP/bundletool.jar" --signature unsigned --source-map android/app/build/generated/sourcemaps/react/release/index.android.bundle.map | tee qa-results/release/android.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: independent-android
          path: |
            native-app/android/app/build/reports/tests
            native-app/android/app/build/outputs/apk/debug/*.apk
            native-app/android/app/build/outputs/bundle/release/*.aab
            native-app/android/app/build/generated/sourcemaps/react/release/*.map
            native-app/qa-results/**
          retention-days: 7
  ios:
    if: ${{ inputs.android_only != true && inputs.testflight_only != true && inputs.review_only != true }}
    runs-on: macos-26
    timeout-minutes: 55
    defaults:
      run:
        working-directory: native-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: native-app/package-lock.json
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          working-directory: native-app
          bundler-cache: true
      - name: Install React Native dependencies
        run: |
          npm ci --ignore-scripts
          bundle exec pod install --project-directory=ios
          bundle exec ruby scripts/configure-ios.rb
      - name: Compile independent iOS app and booking extension
        env:
          ENTRY_FILE: index.qa.js
          FORCE_BUNDLING: '1'
        run: |
          xcodebuild -workspace ios/Promotors.xcworkspace -scheme Promotors -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/IndependentPromotors" CODE_SIGNING_ALLOWED=NO build > "$RUNNER_TEMP/native-ios.log" 2>&1 || { tail -120 "$RUNNER_TEMP/native-ios.log"; exit 1; }
      - name: Capture actual native iPhone and iPad screens
        env:
          PM_CAPTURE_SCOPE: ${{ inputs.ongoing_only && 'ongoing' || 'all' }}
        run: python3 scripts/capture-ios.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: independent-ios
          path: |
            native-app/qa-results/**
            ${{ runner.temp }}/native-ios.log
          retention-days: 7
      - name: Install existing distribution identity
        if: github.event_name == 'workflow_dispatch' && inputs.archive
        env:
          P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
          ACTIVITY_PROFILE_BASE64: ${{ secrets.IOS_ACTIVITY_PROFILE_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/distribution.p12"
          printf '%s' "$PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/distribution.mobileprovision"
          printf '%s' "$ACTIVITY_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/activity.mobileprovision"
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/signing.keychain-db"
          security set-keychain-settings -lut 21600 "$RUNNER_TEMP/signing.keychain-db"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/signing.keychain-db"
          security import "$RUNNER_TEMP/distribution.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$RUNNER_TEMP/signing.keychain-db"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/signing.keychain-db" >/dev/null
          security list-keychains -d user -s "$RUNNER_TEMP/signing.keychain-db"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/.appstoreconnect/private_keys"
          printf '%s' "$ASC_PRIVATE_KEY" > "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          node scripts/configure-distribution.cjs
      - name: Archive production native application
        if: github.event_name == 'workflow_dispatch' && inputs.archive
        env:
          ENTRY_FILE: index.js
        run: |
          set -euo pipefail
          xcodebuild -workspace ios/Promotors.xcworkspace -scheme Promotors -configuration Release -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/PromotorsNative.xcarchive" archive > "$RUNNER_TEMP/native-archive.log" 2>&1 || { tail -120 "$RUNNER_TEMP/native-archive.log"; exit 1; }
          python3 - <<'PY'
          import json,os,plistlib
          profiles=json.load(open(os.environ['RUNNER_TEMP']+'/signing-profiles.json'))
          options={'method':'app-store-connect','destination':'export','teamID':'Z8QYZ8K855','signingStyle':'manual','signingCertificate':'Apple Distribution','provisioningProfiles':profiles}
          with open(os.environ['RUNNER_TEMP']+'/NativeExportOptions.plist','wb') as target: plistlib.dump(options,target)
          PY
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/PromotorsNative.xcarchive" -exportPath "$RUNNER_TEMP/native-export" -exportOptionsPlist "$RUNNER_TEMP/NativeExportOptions.plist"
      - name: Upload production native build
        if: github.event_name == 'workflow_dispatch' && inputs.archive && inputs.upload
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          xcrun altool --upload-app --type ios --file "$RUNNER_TEMP/native-export/Promotors.ipa" --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          node scripts/assign-existing-testflight.cjs
          echo 'Native build uploaded and assigned to the existing internal group; public review and release remain separate.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always() && github.event_name == 'workflow_dispatch' && inputs.archive
        with:
          name: independent-ios-distribution
          path: |
            ${{ runner.temp }}/native-export/*.ipa
            ${{ runner.temp }}/native-archive.log
            ${{ runner.temp }}/testflight-assignment.json
          retention-days: 7

  testflight:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.testflight_only && inputs.review_only != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - run: node --test scripts/test-existing-testflight.cjs
      - name: Assign uploaded build to existing internal group
        env:
          PM_CONFIRM_EXEMPT_VERSION: ${{ inputs.confirm_exempt_version }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s' "$ASC_PRIVATE_KEY" > "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          node native-app/scripts/assign-existing-testflight.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: existing-internal-testflight
          path: ${{ runner.temp }}/testflight-assignment.json
          retention-days: 7
  appstore-review:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.review_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - name: Check exact review build and cancellation guards
        run: |
          node --check native-app/scripts/submit-appstore-review.cjs
          node --test scripts/test-appstore-review.cjs
      - name: Read or submit the exact existing App Store build
        env:
          PM_REVIEW_MODE: ${{ inputs.review_mode }}
          PM_CONFIRM_REVIEW_VERSION: ${{ inputs.confirm_review_version }}
          PM_CONFIRM_REPLACED_BUILD: ${{ inputs.confirm_replaced_build }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: node native-app/scripts/submit-appstore-review.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: appstore-review-status
          path: ${{ runner.temp }}/appstore-review-status.json
          retention-days: 7
