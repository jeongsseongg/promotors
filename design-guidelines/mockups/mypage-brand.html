<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>마이페이지 — 인사 + 지금 내 차 + 메뉴 4묶음 (브랜드 색)</title>

<!-- 폰트는 저장해 둔 Pretendard, 색은 프로모터스 기존 브랜드(네이비+옐로우) -->
<link rel="stylesheet" href="../../fonts/pretendard/pretendard.css">

<style>
  :root {
    --font-sans: var(--font-pretendard, 'Pretendard Variable', 'Pretendard', 'Noto Sans KR', sans-serif);

    /* 브랜드 — style.css :root 와 동일 값 */
    --navy: #1e2464;
    --navy-deep: #171c4f;
    --yellow: #f5c400;
    --red: #c0392b;
    --line: #dfe3e8;
    --text-muted: #596675;

    --bg: #eef0f4;
    --surface: #ffffff;
    --label: #14183c;
    --label-sub: #70737c;
    --label-dim: #9aa5b1;

    --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 20px; --s6: 24px;
    --r-md: 14px; --r-lg: 18px; --r-full: 999px;

    --t-title: 22px;
    --t-body: 16px;
    --t-label: 14px;
    --t-caption: 12px;

    --tabbar-h: 64px;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--label);
    font-family: var(--font-sans);
    -webkit-font-smoothing: antialiased;
  }

  body {
    max-width: 430px;
    min-height: 100vh;
    margin: 0 auto;
    padding: var(--s5) var(--s4) calc(var(--tabbar-h) + var(--s5));
    display: grid;
    gap: var(--s5);
  }

  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
  h1, h2, p { margin: 0; word-break: keep-all; }
  .chevron { flex: 0 0 auto; color: var(--label-dim); }

  /* ── 1. 인사 ─────────────────────────────────────────────────────── */
  .greet { display: grid; gap: var(--s2); }
  .greet h1 { font-size: var(--t-title); font-weight: 800; letter-spacing: -0.03em; }
  .greet p { font-size: var(--t-label); color: var(--text-muted); line-height: 1.5; }
  .greet p b { color: var(--navy); font-weight: 700; }

  /* ── 2. 지금 내 차 ───────────────────────────────────────────────── */
  .now {
    border-radius: var(--r-lg);
    background: var(--navy);
    color: #fff;
    overflow: hidden;
  }
  .now-body { display: grid; gap: var(--s4); padding: var(--s5) var(--s4); }

  .now-tags { display: flex; align-items: center; gap: var(--s2); }
  .plate {
    padding: 5px 10px;
    border: 1px solid rgba(255, 255, 255, .45);
    border-radius: var(--r-full);
    font-size: var(--t-caption);
    font-weight: 600;
    letter-spacing: .01em;
  }
  .state {
    padding: 5px 12px;
    border-radius: var(--r-full);
    background: var(--yellow);
    color: var(--navy);
    font-size: var(--t-caption);
    font-weight: 800;
  }

  .now-car { display: grid; gap: var(--s1); }
  .now-car strong { font-size: 26px; font-weight: 800; letter-spacing: -0.03em; }
  .now-car span { font-size: var(--t-label); color: rgba(255, 255, 255, .88); }

  .now-rate { display: flex; align-items: baseline; justify-content: space-between; gap: var(--s3); }
  .now-rate strong { font-size: 34px; font-weight: 800; color: var(--yellow); letter-spacing: -0.03em; }
  .now-rate strong i { font-size: 20px; font-style: normal; }
  .now-rate span { font-size: var(--t-label); font-weight: 600; color: rgba(255, 255, 255, .92); }

  .bar { height: 8px; border-radius: var(--r-full); background: rgba(255, 255, 255, .2); overflow: hidden; }
  .bar i { display: block; height: 100%; border-radius: var(--r-full); background: var(--yellow); }

  .stages { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .stages span {
    min-height: 32px;
    display: grid;
    place-items: center;
    border-radius: 9px;
    background: rgba(255, 255, 255, .12);
    color: rgba(255, 255, 255, .85);
    font-size: var(--t-caption);
    font-weight: 600;
  }
  .stages span.done { background: #fff; color: var(--navy); }
  .stages span.now { background: var(--yellow); color: var(--navy); font-weight: 800; }

  .next-book {
    display: flex;
    align-items: center;
    gap: var(--s2);
    width: 100%;
    min-height: 52px;
    padding: 0 var(--s4);
    background: var(--navy-deep);
    color: #fff;
    text-align: left;
  }
  .next-book .ico { color: var(--yellow); display: grid; place-items: center; }
  .next-book em { flex: 1; font-style: normal; font-size: var(--t-label); font-weight: 600; }
  .next-book b { font-size: var(--t-label); font-weight: 700; }
  .next-book .chevron { color: rgba(255, 255, 255, .6); }

  /* ── 3. 메뉴 4묶음 ───────────────────────────────────────────────── */
  .group { display: grid; gap: var(--s2); }
  .group > h2 {
    padding-left: var(--s1);
    font-size: var(--t-caption);
    font-weight: 700;
    color: var(--label-sub);
  }
  .list {
    border-radius: var(--r-md);
    background: var(--surface);
    overflow: hidden;
  }
  .row {
    display: flex;
    align-items: center;
    gap: var(--s3);
    width: 100%;
    min-height: 56px;
    padding: 0 var(--s4);
    text-align: left;
  }
  .row + .row { border-top: 1px solid var(--line); }
  .row .ico { flex: 0 0 auto; display: grid; place-items: center; color: var(--navy); }
  .row strong { flex: 1; font-size: var(--t-body); font-weight: 600; }
  .row .meta { font-size: var(--t-label); color: var(--label-sub); }
  .row .meta.alert { color: var(--red); font-weight: 700; }
  .row .meta.reply { display: inline-flex; align-items: center; gap: 5px; color: var(--navy); font-weight: 700; }
  .row .meta.reply::before {
    content: "";
    width: 6px;
    height: 6px;
    border-radius: var(--r-full);
    background: var(--red);
  }

  /* ── 하단 탭바 ───────────────────────────────────────────────────── */
  .tabbar {
    position: fixed;
    left: 50%;
    bottom: 0;
    transform: translateX(-50%);
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    width: 100%;
    max-width: 430px;
    height: var(--tabbar-h);
    background: var(--surface);
    border-top: 1px solid var(--line);
  }
  .tabbar button {
    display: grid;
    justify-items: center;
    align-content: center;
    gap: var(--s1);
    color: var(--label-dim);
    font-size: var(--t-caption);
    font-weight: 600;
  }
  .tabbar button[aria-current="page"] { color: var(--navy); font-weight: 700; }
</style>
</head>
<body>

<!-- 1. 인사 -->
<header class="greet">
  <h1>남미희님, 안녕하세요</h1>
  <p>오늘 <b>비 예보</b>가 있어요. 와이퍼 상태 봐주세요.</p>
</header>

<!-- 2. 지금 내 차 -->
<section class="now" aria-label="지금 내 차">
  <div class="now-body">
    <div class="now-tags">
      <span class="plate">141오 7116</span>
      <span class="state">작업중</span>
    </div>

    <div class="now-car">
      <strong>BMW X3</strong>
      <span>오일필터 하우징 가스켓 교환 · 안산점</span>
    </div>

    <div>
      <div class="now-rate">
        <strong>66<i>%</i></strong>
        <span>검수까지 약 2시간</span>
      </div>
    </div>

    <div class="bar" role="img" aria-label="정비 진행률 66%"><i style="width: 66%;"></i></div>

    <div class="stages">
      <span class="done">접수</span>
      <span class="done">진단</span>
      <span class="now">작업</span>
      <span>검수</span>
      <span>출고</span>
    </div>
  </div>

  <button type="button" class="next-book">
    <span class="ico" aria-hidden="true">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 11h18"/></svg>
    </span>
    <em>다음 예약</em>
    <b>8월 5일 (화) 오후 2:00</b>
    <span class="chevron" aria-hidden="true">›</span>
  </button>
</section>

<!-- 3. 메뉴 4묶음 -->
<section class="group">
  <h2>내 차</h2>
  <div class="list">
    <button type="button" class="row">
      <span class="ico" aria-hidden="true">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 17h14l-1.5-5.5A2 2 0 0 0 15.6 10H8.4a2 2 0 0 0-1.9 1.5z"/><circle cx="7.5" cy="17" r="1.6"/><circle cx="16.5" cy="17" r="1.6"/></svg>
      </span>
      <strong>내 차 관리</strong>
      <span class="meta alert">타이어 교체 권장</span>
      <span class="chevron" aria-hidden="true">›</span>
    </button>
    <button type="button" class="row">
      <span class="ico" aria-hidden="true">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H7a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7z"/><path d="M14 2v5h5M9 13h6M9 17h4"/></svg>
      </span>
      <strong>정비 이력</strong>
      <span class="meta">8건</span>
      <span class="chevron" aria-hidden="true">›</span>
    </button>
    <button type="button" class="row">
      <span class="ico" aria-hidden="true">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l.9-5.2A8 8 0 1 1 21 12"/></svg>
      </span>
      <strong>공업사에 한마디</strong>
      <span class="meta reply">답변 1</span>
      <span class="chevron" aria-hidden="true">›</span>
    </button>
  </div>
</section>

<section class="group">
  <h2>예약</h2>
  <div class="list">
    <button type="button" class="row">
      <span class="ico" aria-hidden="true">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 11h18M12 15v4M10 17h4"/></svg>
      </span>
      <strong>정비 예약하기</strong>
      <span class="chevron" aria-hidden="true">›</span>
    </button>
    <button type="button" class="row">
      <span class="ico" aria-hidden="true">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>
      </span>
      <strong>예약 내역</strong>
      <span class="meta">다음 8월 5일</span>
      <span class="chevron" aria-hidden="true">›</span>
    </button>
  </div>
</section>

<section class="group">
  <h2>고객센터</h2>
  <div class="list">
    <button type="button" class="row">
      <span class="ico" aria-hidden="true">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21.5 16.9v2.5a2 2 0 0 1-2.2 2 19.6 19.6 0 0 1-8.5-3 19.3 19.3 0 0 1-6-6 19.6 19.6 0 0 1-3-8.6A2 2 0 0 1 3.7 1.6h2.5a2 2 0 0 1 2 1.7c.1 1 .3 1.9.6 2.8a2 2 0 0 1-.4 2.1L7.3 9.3a16 16 0 0 0 6 6l1.1-1.1a2 2 0 0 1 2.1-.5c.9.3 1.8.5 2.8.6a2 2 0 0 1 1.7 2"/></svg>
      </span>
      <strong>전화 · 채팅 문의</strong>
      <span class="meta reply">답변 1</span>
      <span class="chevron" aria-hidden="true">›</span>
    </button>
    <button type="button" class="row">
      <span class="ico" aria-hidden="true">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.5a2.5 2.5 0 0 1 4.9.5c0 1.7-2.5 2.5-2.5 2.5M12 17h.01"/></svg>
      </span>
      <strong>자주 묻는 질문</strong>
      <span class="chevron" aria-hidden="true">›</span>
    </button>
  </div>
</section>

<section class="group">
  <h2>내 정보</h2>
  <div class="list">
    <button type="button" class="row">
      <span class="ico" aria-hidden="true">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      </span>
      <strong>회원정보 수정</strong>
      <span class="chevron" aria-hidden="true">›</span>
    </button>
    <button type="button" class="row">
      <span class="ico" aria-hidden="true">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
      </span>
      <strong>알림 설정</strong>
      <span class="meta">켜짐</span>
      <span class="chevron" aria-hidden="true">›</span>
    </button>
  </div>
</section>

<nav class="tabbar" aria-label="주요 메뉴">
  <button type="button">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 10 9-7 9 7v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
    소개
  </button>
  <button type="button">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/></svg>
    매장안내
  </button>
  <button type="button">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.7 6.3a4 4 0 0 0 5 5l-9 9a2.8 2.8 0 1 1-4-4z"/></svg>
    정비사례
  </button>
  <button type="button">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11v2a1 1 0 0 0 1 1h2l5 4V6L6 10H4a1 1 0 0 0-1 1"/><path d="M16 8a5 5 0 0 1 0 8"/></svg>
    게시판
  </button>
  <button type="button" aria-current="page">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    마이
  </button>
</nav>

</body>
</html>
